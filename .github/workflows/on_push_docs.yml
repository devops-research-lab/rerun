name: Push Docs
on:
  push: null
concurrency:
  group: on-push-docs
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.crate_version }}
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.41.4
    - name: Get version
      id: versioning
      run: 'crate_version=$(pixi run python scripts/ci/crates.py get-version --from=cratesio --skip-prerelease)

        echo "crate_version=$crate_version" >> "$GITHUB_OUTPUT"

        '
  build-search-index:
    runs-on: ubuntu-latest-16-cores
    strategy:
      matrix:
        toolchain:
        - nightly-2025-02-05
    needs:
    - get-version
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
      with:
        cache_key: build-linux
        save_cache: false
        workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        toolchains: ${{ matrix.toolchain }}
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.41.4
        environments: py-docs
    - name: Install rerun-sdk
      run: ''
    - name: Build search index
      env:
        RUSTFLAGS: -Awarnings --cfg disable_web_viewer_server
      run: "pixi run search-index build \\\n  landing \\\n  --url \"https://edge.meilisearch.com\" \\\n\
        \  --master-key \"${{ secrets.MEILISEARCH_TOKEN }}\" \\\n  --release-version \"${{ needs.get-version.outputs.version\
        \ }}\" \\\n  --rust-toolchain \"${{ matrix.toolchain }}\"\n"
  redeploy-rerun-io:
    runs-on: ubuntu-latest
    needs:
    - get-version
    steps:
    - uses: actions/checkout@v4
    - name: Re-deploy rerun.io
      uses: ./.github/actions/vercel
      with:
        command: deploy
        vercel_token: ${{ secrets.VERCEL_TOKEN }}
        vercel_team_name: ${{ vars.VERCEL_TEAM_NAME }}
        vercel_project_name: ${{ vars.VERCEL_PROJECT_NAME }}
        release_commit: docs-latest
        release_version: ${{ needs.get-version.outputs.version }}
        target: production
